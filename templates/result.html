<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Processing Result</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f6f8; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.08); width: 420px; text-align: center; }
        h1 { font-size: 22px; color: #2b6cb0; margin-bottom: 12px; }
        p { color: #4a5568; font-size: 15px; margin-bottom: 24px; line-height: 1.5; }
        a { display: inline-block; background: #3182ce; color: white; padding: 10px 20px; text-decoration: none; border-radius: 6px; font-weight: 600; }
        a:hover { background: #2b6cb0; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Completed</h1>
        <p>{{ result }}</p>
        <a href="/">Back to Home</a>
    </div>
</body>
</html>
